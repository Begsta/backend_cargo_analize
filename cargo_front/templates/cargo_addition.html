<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Добавление груза</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="rama-telefona">
      <main class="stranica-s-vkladkami">
        <header class="shapka-chernovika">
          <span class="znak-wolff">WOLFF</span>
          <h1 class="zagolovok-stranicy">Добавление груза</h1>
          {% if has_draft %}
          <span class="status-chernovik">черновик</span>
          {% endif %}
        </header>

        <section class="blok-minio">
          <h2>Изображение</h2>
          <img
            class="prevyu-minio"
            src="/static/img/default-cargo.jpg"
            alt="Заглушка изображения груза"
          />
          <input class="pole-fayla" type="file" accept="image/*" aria-label="Файл изображения (не сохраняется)" />
        </section>

        <section class="blok-minio">
          <h2>Видео цикла</h2>
          <video class="prevyu-minio" src="{{ cargo.video_url }}" muted controls></video>
          <input class="pole-fayla" type="file" accept="video/*" aria-label="Файл видео (не сохраняется)" />
        </section>

        {% if not has_draft %}
        <form method="post" action="/cargo_addition/next">
          <label class="metka-polya" for="cargo_name">Наименование груза</label>
          <input class="pole-gruza" id="cargo_name" name="cargo_name" type="text" value="" required />
          <button class="knopka-deystviya" type="submit">Далее</button>
        </form>
        {% else %}
        <form method="post" action="/cargo_addition/publish">
          <label class="metka-polya" for="cargo_name">Наименование груза</label>
          <input class="pole-gruza" id="cargo_name" name="cargo_name" type="text" value="{{ cargo.cargo_name }}" required />

          <label class="metka-polya" for="cargo_description">Описание груза</label>
          <textarea class="pole-gruza" id="cargo_description" name="cargo_description">{{ cargo.cargo_description }}</textarea>

          <label class="metka-polya" for="cargo_mass">Масса груза, т</label>
          <input
            class="pole-gruza pole-chislo"
            id="cargo_mass"
            name="cargo_mass"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            value=""
            required
          />

          <label class="metka-polya" for="cargo_volume">Объём груза, м³</label>
          <input
            class="pole-gruza pole-chislo"
            id="cargo_volume"
            name="cargo_volume"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            value=""
            required
          />

          <button class="knopka-deystviya knopka-opublikovat" type="submit">Опубликовать</button>
        </form>
        {% endif %}
      </main>
      <nav class="panel-vkladok-podyoma">
        <a class="vkladka-podyoma" href="/lift_feed">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M10 9l6 3-6 3V9z"/></svg>
          Лента
        </a>
        <a class="vkladka-podyoma aktivna" href="/cargo_addition">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Добавление
        </a>
        <a class="vkladka-podyoma" href="/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
          Каталог
        </a>
      </nav>
    </div>
  </body>
</html>
