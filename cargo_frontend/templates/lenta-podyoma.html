<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Лента подъёма — {{ cargo.cargo_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="rama-telefona">
      <section class="ekran-lenty">
        <video
          class="video-cikla"
          autoplay
          muted
          loop
          playsinline
          poster="{{ cargo.image_url }}"
          src="{{ cargo.video_url }}"
        ></video>
        <div class="gradient-niz"></div>
        <div class="sloi-dannyh">
          <div class="kolonka-teksta">
            <span class="znak-wolff">WOLFF</span>
            <h1 class="naimenovanie-gruza">{{ cargo.cargo_name }}</h1>
            <details class="opisanie-podyoma">
              <summary>Описание груза</summary>
              <p class="tekst-opisaniya">{{ cargo.cargo_description }}</p>
            </details>
          </div>
          <aside class="kolonka-sprava" aria-label="Параметры и действия">
            <dl class="polya-podyoma">
              <div>
                <dt>Масса</dt>
                <dd>{{ cargo.cargo_mass }} т</dd>
              </div>
              <div>
                <dt>Объём</dt>
                <dd>{{ cargo.cargo_volume }} м³</dd>
              </div>
            </dl>
            <div class="ikonki-sprava">
              <div class="otmetka-interesa">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-4.2-9.2-8.1C.6 10 1.1 6.6 4 5.2 6.2 4.1 8.6 5 12 8.1 15.4 5 17.8 4.1 20 5.2c2.9 1.4 3.4 4.8 1.2 7.7C18.5 16.8 12 21 12 21z"/></svg>
                <span class="kolichestvo-otmetok">{{ interest_marks }}</span>
              </div>
              <a
                class="ikonka-sleduyushchiy"
                href="/cargo/{{ cargo.cargo_id }}?next_video=true"
                aria-label="Следующий груз"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <span>Далее</span>
              </a>
            </div>
          </aside>
        </div>
      </section>
      <nav class="panel-vkladok-podyoma">
        <a class="vkladka-podyoma aktivna" href="/lift_feed">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M10 9l6 3-6 3V9z"/></svg>
          Лента
        </a>
        <a class="vkladka-podyoma" href="/cargo_addition">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Добавление
        </a>
        <a class="vkladka-podyoma" href="/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
          Каталог
        </a>
      </nav>
    </div>
  </body>
</html>
